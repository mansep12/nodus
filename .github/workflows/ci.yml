name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Packages and web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - name: Build the web app
        run: bun run --filter @nodus/web build
        env:
          # Any valid contract addresses do: the build only needs them to exist.
          NEXT_PUBLIC_NODUS_CONTRACT: CD5YKQ3KJY7ICVFCPOBEXQZ4HJK6GETNAGZI3LEFOEOOT7L3NKQ3AXWC
          NEXT_PUBLIC_TOKEN_CONTRACT: CADZMBHVXZTZA2Y3ESCULWLZ75YRICE66RPD75OZ7HWVYT7VWEKMSECI

  contracts:
    name: Soroban contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target wasm32v1-none
      - run: cargo test
