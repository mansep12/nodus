<!doctype html>
<!--

  el dibujo del video. Se saca con Chromium:

    chrome --headless --hide-scrollbars --window-size=1280,720 \
      --force-device-scale-factor=2 --virtual-time-budget=8000 \
      --screenshot=pitch/out/portada.png pitch/portada.html

  A escala 2 sale de 2560×1440; YouTube la pide de 1280×720 o más, en 16:9 y
  bajo 2 MB (la reducida es pitch/out/portada.jpg).
-->

        --canvas: #f5f5f5;
        --ink: #0c0a09;
        --body: #4e4e4e;
        --muted: #716b63;
        --free: #197a55;
        --free-deep: #135f43;

      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: var(--canvas);
        color: var(--ink);
        font-family: Inter, sans-serif;
        position: relative;
      }
      .bloom {
        position: absolute;
        border-radius: 50%;
      }
      .grain {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgba(12, 10, 9, 0.1) 1px, transparent 1.4px);
        background-size: 34px 34px;
        opacity: 0.5;
      }
      .copy {
        position: absolute;
        left: 76px;
        top: 0;
        bottom: 0;
        width: 560px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 16px;
        font-family: Newsreader, serif;
        font-size: 58px;
        letter-spacing: -0.02em;
        line-height: 1;
      }
      .logo svg {
        width: 72px;
        height: 72px;
      }
      h1 {
        margin-top: 44px;
        font-family: Newsreader, serif;
        font-weight: 300;
        font-size: 96px;
        line-height: 0.98;
        letter-spacing: -0.035em;
      }
      h1 em {
        font-weight: 300;
      }
      .pill {
        margin-top: 44px;
        align-self: flex-start;
        background: var(--ink);
        color: #fff;
        border-radius: 999px;
        padding: 16px 30px;
        font-size: 29px;
        font-weight: 500;
        letter-spacing: 0;
      }
      .pill b {
        font-weight: 600;
        color: #a7e5d3;
      }
      #ring {
        position: absolute;
        left: 600px;
        top: 0;
        width: 680px;
        height: 720px;
      }
      #ring text {
        font-family: Inter, sans-serif;
      }
      #ring .figure {
        font-family: Newsreader, serif;
        font-weight: 300;
      }
    </style>
  </head>

      <h1>Desanuda las deudas <em>entre negocios.</em></h1>
      <div class="pill">Solo se paga <b>la diferencia</b></div>

    <svg id="ring" viewBox="0 0 680 720"></svg>

    <script>
      // El círculo del video: el molino le debe 80 al flete, el flete 90 a la panadería y la panadería 100 al molino.
      const GLYPHS = {
        panaderia: ["M5 24 H27 V16 A11 8.5 0 0 0 5 16 Z", "M10.5 14 L13 19 M15.5 12.5 L18 17.5 M20.5 14 L23 19"],
        molino: ["M10 28 L12.5 18.5 L16 15 L19.5 18.5 L22 28 Z", "M9.5 4.5 L22.5 17.5 M22.5 4.5 L9.5 17.5"],
        fletes: [
          "M6 21 H4 V8 H18 V21 H12 M18 12 H23 L28 17 V21 H26 M18 21 H20",
          "M12 22.5 A3 3 0 1 0 6 22.5 A3 3 0 1 0 12 22.5 M26 22.5 A3 3 0 1 0 20 22.5 A3 3 0 1 0 26 22.5",
        ],
      };
      const [CX, CY, R, NODE] = [340, 356, 218, 43];
      // Los ángulos van en el sentido del reloj desde arriba, como las flechas.
      const PARTIES = [
        { glyph: "molino", angle: 300, owes: 80 },
        { glyph: "fletes", angle: 60, owes: 90 },
        { glyph: "panaderia", angle: 180, owes: 100 },
      ];
      const at = (angle, radius = R) => {
        const rad = ((angle - 90) * Math.PI) / 180;
        return [CX + radius * Math.cos(rad), CY + radius * Math.sin(rad)];
      };
      const gap = (Math.asin(NODE / 2 / R) * 2 * 180) / Math.PI + 3;
      let svg = "";
      PARTIES.forEach((party, i) => {
        const next = PARTIES[(i + 1) % PARTIES.length];
        const from = party.angle + gap;
        const to = (next.angle <= party.angle ? next.angle + 360 : next.angle) - gap - 6.5;
        const [x1, y1] = at(from);
        const [x2, y2] = at(to);
        svg += `<path d="M${x1} ${y1} A${R} ${R} 0 0 1 ${x2} ${y2}" fill="none" stroke="var(--free)" stroke-width="9" stroke-linecap="round"/>`;
        // La punta, girada según la tangente del círculo donde termina el arco.
        const [tx, ty] = at(to + 3);
        svg += `<path d="M-15 -13 L8 0 L-15 13 Z" fill="var(--free)" stroke="var(--free)" stroke-width="4" stroke-linejoin="round" transform="translate(${tx} ${ty}) rotate(${to + 3})"/>`;
        const [lx, ly] = at((from + to) / 2, R + 54);
        svg += `<text class="figure" x="${lx}" y="${ly + 16}" text-anchor="middle" font-size="50" fill="var(--ink)">${party.owes}</text>`;
      });
      PARTIES.forEach((party) => {
        const [x, y] = at(party.angle);
        svg += `<circle cx="${x}" cy="${y}" r="${NODE}" fill="#fff" stroke="var(--ink)" stroke-width="3.5"/>`;
        svg += `<g transform="translate(${x - 28} ${y - 28}) scale(1.75)" fill="none" stroke="var(--ink)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${GLYPHS[party.glyph].map((d) => `<path d="${d}"/>`).join("")}</g>`;
      });
      svg += `<text x="${CX}" y="${CY - 92}" text-anchor="middle" font-size="19" font-weight="600" letter-spacing="2.4" fill="var(--muted)">BASTA CON MOVER</text>`;
      svg += `<text class="figure" x="${CX}" y="${CY + 62}" text-anchor="middle" font-size="176" letter-spacing="-5" fill="var(--free)">20</text>`;
      svg += `<text x="${CX}" y="${CY + 108}" text-anchor="middle" font-size="24" fill="var(--body)">de 270 en deudas</text>`;
      document.getElementById("ring").innerHTML = svg;
    </script>
